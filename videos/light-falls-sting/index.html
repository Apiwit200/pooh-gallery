    <script>
      const frames = [{"ev":12.3,"label":"EV 12.3","y":18.499999999999996},{"ev":10.8,"label":"EV 10.8","y":25.999999999999996},{"ev":6.3,"label":"EV 6.3","y":48.5},{"ev":3.5,"label":"EV 3.5","y":62.5},{"ev":2.2,"label":"EV 2.2","y":69},{"ev":-0.7,"label":"EV −0.7","y":83.5},{"ev":null,"label":"EV —","y":104}];
      const slot = 1.2333;
      const tl = gsap.timeline({ paused: true });
      const meter = document.getElementById("meter");
      frames.forEach((f, i) => {
        const plate = "#plate-" + i;
        const img = "#img-" + i;
        const at = i * slot;
        tl.fromTo(plate, { opacity: 0 }, { opacity: 1, duration: i === 0 ? 0.8 : 0.55, ease: "power1.inOut" }, i === 0 ? 0 : at - 0.35);
        tl.fromTo(img, { scale: 1.12 }, { scale: 1, duration: slot + 0.9, ease: "none" }, Math.max(0, at - 0.35));
        tl.to("#marker", { y: (f.y / 100) * meter.clientHeight, duration: i === 0 ? 0.01 : 0.6, ease: "expo.out" }, Math.max(0, at - 0.2));
        tl.fromTo("#r-" + i, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, Math.max(0, at - 0.15));
        if (i > 0) tl.to("#r-" + (i - 1), { opacity: 0, y: -14, duration: 0.3, ease: "power2.in" }, at - 0.2);
      });
      tl.fromTo("#title", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 1.2, ease: "expo.out" }, 7.4 + 0.2);
      tl.fromTo("#credit", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 7.4 + 0.7);
      tl.to(["#meter", "#reading"], { opacity: 0, duration: 0.8 }, 7.4 + 0.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
